# Nginx entry point: round-robin over the two web processes.
# Request bodies are streamed straight through (no buffering) so the
# applications can enforce their own 2 MiB per-request / 4 MiB shared budgets
# chunk by chunk; client_max_body_size is therefore left unrestricted here.
upstream mtls_workers {
    server web1:8080;
    server web2:8080;
}

server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://mtls_workers;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
